<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — доктор Родин</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=Unbounded:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f6fc;
      --surface: #dde8f8;
      --accent: #1f55d6;
      --accent-deep: #123a9c;
      --accent-soft: #dbe7ff;
      --ink: #111f39;
      --muted: #5a6984;
      --line: rgba(17, 31, 57, .13);
      --serif: "Unbounded", "Onest", "Segoe UI", sans-serif;
      --sans: "Onest", "Segoe UI", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 32px 20px;
      background:
        radial-gradient(900px 500px at 15% 0%, #ffffff 0%, rgba(255, 255, 255, 0) 60%),
        radial-gradient(700px 500px at 90% 100%, var(--surface) 0%, rgba(221, 232, 248, 0) 65%),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      letter-spacing: .16em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--muted);
    }

    .brand span {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-family: var(--serif);
      font-size: 15px;
      letter-spacing: 0;
    }

    .code {
      font-family: var(--serif);
      font-size: clamp(84px, 18vw, 150px);
      line-height: .9;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: -.03em;
      margin: 0;
      text-shadow: 0 18px 40px rgba(31, 85, 214, .16);
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(20px, 3.2vw, 30px);
      font-weight: 500;
      margin: 0;
      max-width: 22ch;
      line-height: 1.25;
    }

    p {
      margin: 0;
      max-width: 46ch;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 4px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 0 26px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 12px 28px rgba(31, 85, 214, .28);
    }

    .btn-primary:hover { background: var(--accent-deep); transform: translateY(-2px); }

    .btn-ghost {
      border: 1px solid var(--line);
      color: var(--ink);
      background: rgba(255, 255, 255, .6);
    }

    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .note { font-size: 13px; color: var(--muted); opacity: .85; }
    .note a { color: var(--accent); }
  </style>
</head>
<body>
  <a class="brand" href="/"><span>Р</span>доктор Родин</a>

  <p class="code" aria-hidden="true">404</p>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Проверьте адрес или вернитесь на главную — там вся информация о лазерной коррекции зрения.</p>

  <div class="actions">
    <a class="btn btn-primary" href="/">На главную</a>
    <a class="btn btn-ghost" href="/reviews">Отзывы пациентов</a>
  </div>

  <p class="note">Если вы попали сюда по ссылке с другого сайта — <a href="/#contacts">напишите нам</a>, мы поправим.</p>
</body>
</html>
